global:
  resolve_timeout: 1m

route:
  receiver: incident-receiver
  group_by: [alertname, node]
  group_wait: 5s
  group_interval: 15s
  repeat_interval: 1h
  routes:
    - match:
        severity: critical
      receiver: incident-receiver
      group_wait: 2s
      repeat_interval: 15m

receivers:
  - name: incident-receiver
    webhook_configs:
      - url: "http://127.0.0.1:9095/webhook"
        send_resolved: true
