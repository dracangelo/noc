groups:
  - name: noc-availability
    rules:
      - alert: NodeDown
        expr: probe_success{job="lab-icmp"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.instance }} is not responding to ICMP"

      - alert: HighLatency
        expr: probe_icmp_duration_seconds{job="lab-icmp",phase="rtt"} > 0.05
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "RTT to {{ $labels.instance }} above 50 ms"
