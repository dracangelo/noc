global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["127.0.0.1:9115"]

  # ICMP reachability of every lab node over the management network
  - job_name: lab-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: ["172.20.20.11"]
        labels: { node: core1, role: core }
      - targets: ["172.20.20.12"]
        labels: { node: core2, role: core }
      - targets: ["172.20.20.13"]
        labels: { node: dist1, role: distribution }
      - targets: ["172.20.20.14"]
        labels: { node: dist2, role: distribution }
      - targets: ["172.20.20.15"]
        labels: { node: host1, role: host }
      - targets: ["172.20.20.16"]
        labels: { node: host2, role: host }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
